name: One-time RSVP update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply RSVP changes
        run: python3 scripts/update_rsvp.py

      - name: Commit changes and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/update_rsvp.py .github/workflows/one-time-rsvp-update.yml
          git add src/routes/index.tsx scripts/update_rsvp.py .github/workflows/one-time-rsvp-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply RSVP verification and gallery cleanup"
            git push
          fi
